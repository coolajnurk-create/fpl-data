name: Update FPL data

on:
  schedule:
    # Light update (bootstrap + fixtures, 2 requests) every 2 hours
    - cron: "0 */2 * * *"
    # Full update (--top 100, ~102 requests) twice a day, 05:30 and 17:30 UTC
    - cron: "30 5,17 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "full = with player histories (--top 100), light = without"
        type: choice
        options:
          - full
          - light
        default: full

permissions:
  contents: write

concurrency:
  group: fpl-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Get current data from the data branch
        run: |
          if git fetch --depth=1 origin data 2>/dev/null; then
            git show FETCH_HEAD:fpl_data.json > "$RUNNER_TEMP/old.json"
            echo "Previous data found"
          else
            echo "No data branch yet"
          fi

      - name: Choose mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            mode="${{ inputs.mode }}"
          elif [ "${{ github.event.schedule }}" = "30 5,17 * * *" ]; then
            mode="full"
          else
            mode="light"
          fi
          # A light update needs old histories to keep; without them, do a full one
          if [ "$mode" = "light" ] && [ ! -f "$RUNNER_TEMP/old.json" ]; then
            mode="full"
          fi
          echo "Mode: $mode"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Download FPL data
        run: |
          if [ "${{ steps.mode.outputs.mode }}" = "full" ]; then
            python fpl_update.py --top 100 --out "$RUNNER_TEMP/new.json"
          else
            python fpl_update.py --keep-summaries "$RUNNER_TEMP/old.json" --out "$RUNNER_TEMP/new.json"
          fi

      - name: Publish to data branch (one commit, force-push)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$RUNNER_TEMP"
          if [ -f old.json ] && [ "$(jq -S 'del(.fetched_at)' new.json | md5sum)" = "$(jq -S 'del(.fetched_at)' old.json | md5sum)" ]; then
            echo "No changes"
            exit 0
          fi
          mkdir publish
          cd publish
          git init -q -b data
          cp ../new.json fpl_data.json
          git config user.name "fpl-bot"
          git config user.email "fpl-bot@users.noreply.github.com"
          git add fpl_data.json
          git commit -q -m "FPL data ${{ steps.mode.outputs.mode }} $(date -u '+%F %H:%M') UTC"
          git push --force -q "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" data
          echo "Published to the data branch"
