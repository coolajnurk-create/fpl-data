name: Update FPL data

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download FPL data
        run: python fpl_update.py --top 100 --out fpl_data.json
      - name: Commit the new data
        run: |
          git config user.name "fpl-bot"
          git config user.email "fpl-bot@users.noreply.github.com"
          git add fpl_data.json
          git diff --staged --quiet || git commit -m "Update FPL data $(date -u '+%F %H:%M') UTC"
          git push
