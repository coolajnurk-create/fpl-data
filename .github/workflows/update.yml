name: Update FPL data

on:
  schedule:
    - cron: "0 5 * * *"
    - cron: "*/10 11-22 * * 0,5,6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fpl-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download FPL data
        run: python fpl_update.py --top 100 --out new.json
      - name: Commit only if changed
        run: |
          if [ -f fpl_data.json ] && [ "$(jq -S 'del(.fetched_at)' new.json | md5sum)" = "$(jq -S 'del(.fetched_at)' fpl_data.json | md5sum)" ]; then
            echo "No changes"
            exit 0
          fi
          mv new.json fpl_data.json
          git config user.name "fpl-bot"
          git config user.email "fpl-bot@users.noreply.github.com"
          git add fpl_data.json
          git commit -m "Update FPL data $(date -u '+%F %H:%M') UTC"
          git push
